<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Demonstration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content-box">
        <h3>Content-Box</h3>
        <p>
            This div uses box-sizing: content-box. The total width is 300px 
            + 40px (padding) + 10px (border) = 350px.
        </p>
    </div>

    <div class="border-box">
        <h3>Border-Box</h3>
        <p>
            This div uses box-sizing: border-box. The total width is 
            exactly 300px, including padding and border.
        </p>
    </div>
</body>
</html>
