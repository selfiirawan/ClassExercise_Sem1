<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://placehold.co/300x200" alt="img placeholder">
            <h3>Card Title</h3>
            <p>
                This is a styled card with rounded corners created using the 
                border-radius property. The image has rounded corners only at 
                the top, while the entire card has a rounded border.
            </p>

            <button>Learn More</button>
        </div>
    </div>
</body>
</html>
