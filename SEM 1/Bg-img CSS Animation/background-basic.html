<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: Basic Background Setup</title>
    <style>
        body {
            margin: 0;
        }
        
        .hero {
            height: 800px;
            background-image: url("https://picsum.photos/1200/800");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .title {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h2 class="title">Welcome to My Page</h2>
            <p>This is a hero section with a background image that covers the entire container and is centered.</p>
        </div>
    </div>
</body>
</html>
