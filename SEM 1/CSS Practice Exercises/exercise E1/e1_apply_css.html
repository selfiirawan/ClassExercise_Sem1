<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: Applying CSS</title>
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .second {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>CSS Application Methods</h1>

    <p style="color: red;">
        This is styled with inline CSS
    </p>

    <p class="second">This is styled with internal CSS</p>
</body>
</html>
