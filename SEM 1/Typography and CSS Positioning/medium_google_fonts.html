<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Fonts Typography Hierarchy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        html {
            font-size: 16px;
        }

        article {
            background-color: #f0f0f0;
            padding: 30px;
            width: 700px;
            margin: 30px auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 3.5rem;
            font-family: "Libertinus Serif", serif;
            margin-bottom: 0;
        }

        h2 {
            font-size: 2.5rem;
            font-family: "Libertinus Serif", serif;
            margin-bottom: 0;
            color: rgba(0, 0, 0, 0.775);
        }

        h3 {
            font-size: 2rem;
            font-family: "Libertinus Serif", serif;
            color: rgba(0, 0, 0, 0.686);
            margin-bottom: 0;
        }

        h4 {
            font-size: 1.75rem;
            font-family: "Libertinus Serif", serif;
            color: rgba(0, 0, 0, 0.63);
            margin-bottom: 0;
        }

        p {
            font-family: "DM Sans", sans-serif;
        }

        .subtitle {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 30px;
            color: gray;
        }

        .pull-quote {
            font-family: "Libertinus Serif", serif;
            font-size: 1.5rem;
            font-weight: bold;
            color:indigo;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <article>
        <h1>Main Article Title</h1>
        <p class="subtitle">Article subtitle or introduction</p>
        
        <p>First paragraph of content...</p>
        
        <h2>First Section Heading</h2>
        <p>More content...</p>
        
        <blockquote class="pull-quote">
            This is an important pull quote from the article
        </blockquote>
        
        <h3>Subsection Heading</h3>
        <p>Additional content...</p>
        
        <h4>Minor Heading</h4>
        <p>Final content section...</p>
    </article>
</body>
</html>
