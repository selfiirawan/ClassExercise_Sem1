<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <img src="https://www.toysrus.com.my/dw/image/v2/BDGJ_PRD/on/demandware.static/-/Sites-master-catalog-toysrus/default/dw0bb30754/3/7/a/1/37a1162b0cff2ebdbaf2229ae611c554fefb215a_045496883409__1_.jpg?sw=500&sh=500&q=75" alt="nintendo switch">

        <div class="card-content">
            <h1 class="title">Nintendo Switch</h1>
            <p class="sub-title">CONSOLE GAME</p>

            <p class="description">
                A portable video game console by Nintendo. Perfect console to 
                play with friends and family. Offers variety of exciting game

            </p>

            <p class="tags">Console</p>
            <p class="tags">Portable</p>

            <button class="order">Add to Order</button>
