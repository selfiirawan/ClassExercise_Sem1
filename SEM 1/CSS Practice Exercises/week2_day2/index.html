<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=680&q=80" alt="pizza">

        <div class="card-content">
            <h1 class="title">Margherita Pizza</h1>
            <p class="sub-title">ITALIAN CLASSIC</p>

            <p class="description">Hand-stretched thin crust topped with fresh tomato sauce, creamy mozzarella, and fragrant basil leaves. Baked in a stone oven to perfection.</p>

            <p class="tags">Vegetarian</p>
            <p class="tags">Stone Baked</p>
            <p class="tags">12"</p>

            <p class="price">$12.99</p>

            <button class="save">Save</button>
            <button class="order">Add to Order</button>
        </div>
    </div>
</body>
</html>
