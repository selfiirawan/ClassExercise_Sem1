<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car For Sale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=680&q=80" alt="Car">
        <div class="details">
            <div class="for-sale">
                <p class="sale-text">FOR SALE</p>
            </div>

            <h2>2021 Ford Mustang GT</h2>
            <p class="car-type">Premium . Fastback . V8</p>

            <p class="description">
                One owner, no accidents. Loaded with premium package, Brembo brakes, and
                active exhaust. Garage kept and meticulously maintained.
            </p>
            
            <div class="year">
                <h2>YEAR</h2>
                <span>2021</span>
            </div>

            <p class="price">$38,500</p>

            <button>Contact Seller</button>
        </div>
    </div>
</body>
</html>
