<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .card {
            /* border: 2px solid black; */
            width: 300px;
            border-radius: 15px;
            background-color: white;
            overflow: hidden;
        }

        .card img {
            border-bottom: 1px solid black;
            margin-bottom: 0;
        }

        .card-content {
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTw-NAwqUtWAQIO763NrJszaJITAuNaVuj0esZzMXb2Vw&s=10" alt="iphone duo" width="100%">
            <div class="card-content">
                <h1>iPhone Duo</h1>
                <p>RM 9, 999</p>
                <p>lorem ipsum dolor sit amet. </p>
            </div>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHJnLDzXlSph423_6zoh2XfkkRAmneQ3opCh1wD-CG5A&s=10" alt="iphone 18 pro" width="100%">
            <div class="card-content">
                <h1>iPhone 18 Pro</h1>
                <p>RM 5, 799</p>
                <p>lorem ipsum dolor sit amet. </p>
            </div>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQ3dtz9tkQ7s8D1WVOCJTA2El7D2_SBdDLtQ584qKwDw&s=10" alt="iphone 13" width="100%">
            <div class="card-content">
                <h1>iPhone 13</h1>
                <p>RM 2, 999</p>
                <p>lorem ipsum dolor sit amet. </p>
            </div>
        </div>
    </div>
</body>
</html>
