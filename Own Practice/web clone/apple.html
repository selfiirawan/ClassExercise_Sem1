<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .card {
            width: 350px;
            /* border: 1px solid black; */
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
        }

        img {
            width: 100%;
        }

        .content {
            padding: 20px 30px;
        }

        h4 {
            font-size: 1.1rem;
            padding: 0;
            margin: 15px 0 30px;
        }

        .new {
            padding: 0;
            margin: 10px 0;
            color: rgb(131, 14, 14);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfPAk8arCxU8lKYt5DOTaSmnkiQF-V4B3cLTV-fzv42g&s=10" alt="iphone">

        <div class="content">
            <p class="new">New</p>
            <h4>iPhone 18 Pro TechWoven Case with MagSafe - Burgundy</h4>

            <p>RM 249.00</p>
        </div>
    </div>
</body>
</html>
