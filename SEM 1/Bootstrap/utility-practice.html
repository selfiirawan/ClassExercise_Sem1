<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Exercise 1: Bootstrap Utility Classes Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Bootstrap Utility Classes</h1>
        <p class="text-center fw-bold text-primary">This paragraph has blue text, is bold, and is centered.</p>
        <p class="text-white p-3 bg-success">This paragraph has a green background white text, and padding of size 3.</p>
        <p class="bg-secondary text-end mt-4">This paragraph has a gray background, right-aligned text, and margin-top of size 4.</p>

        <div class="text-center">
            <button class="btn btn-primary mt-3">Centered Button</button>
        </div>

        <div class="shadow p-3 mt-4">This div has a shadow and contains some text.</div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
