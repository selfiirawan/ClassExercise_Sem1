<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Content Box</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content-box">
        <h2>Centered Content Box</h2>
        <p>
            This is a paragraph inside a centered div container. The div is centered 
            using the margin: 0 auto property. This demonstrates how to horizontally
            center block elements with a fixed width.
        </p>
    </div>
</body>
</html>
