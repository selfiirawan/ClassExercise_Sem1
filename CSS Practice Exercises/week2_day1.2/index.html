<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=680&q=80" alt="pizza">

        <div class="card-content">
            <h1 class="title">Margherita Pizza</h1>
            <p class="sub-title">ITALIAN CLASSIC</p>
            <p class="description">
                Hand-stretched thin curst topped with fresh tomato sauce, creamy 
                mozzarella, and fragnant basil leaves. Baked in a stone oven to perfection.
            </p>

            <div class="tags">
                <p>Vegetarian</p>
                <p>Stone Baked</p>
                <p>12"</p>
            </div>

            <p class="price">$12.99</p>

            <div class="button">
                <button class="save-btn">Save</button>
                <button class="add-btn">Add to Order</button>
            </div>
        </div>
    </div>
</body>
</html>
