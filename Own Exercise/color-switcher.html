<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Switcher</title>

    <style>
        body {
            background-color: #242323;
        }

        h1 {
            color: whitesmoke;
            text-align: center;
            margin-top: 50px;
        }

        div {
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 15px;
            background-color: rgba(249, 248, 248, 0.233);
            border-radius: 12px;
            border: 3px solid black;
            margin-right: 15px;
            font-weight: bold;
            font-size: 1rem;
        }

        #default {
            width: 150px;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Click to change the background!</h1>
    <div id="color-app">
        <button class="colorBtn" data-color="#5D1E21">Red</button>
        <button class="colorBtn" data-color="#1F2A44">Blue</button>
        <button class="colorBtn" data-color="#154230">Green</button>
    </div>

    <button id="default" class="colorBtn" data-color="#242323">Default</button>

    <script>
        const buttons = document.querySelectorAll(".colorBtn");

        buttons.forEach(button => {
            button.addEventListener("click", function() {
                const bgColor = button.dataset.color;

                document.body.style.backgroundColor = bgColor;

                buttons.forEach(b => {
                    b.style.color = "";
                });
                button.style.color = "white";
            });
        });
    </script>
</body>
</html>
