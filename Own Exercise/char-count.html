<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <style>

    </style>
</head>
<body>
    <div id="counter-app">
        <textarea id="text-input" rows="10" cols="40"></textarea>
        <p>Characters: <span id="char-count">0</span></p>
        <p>Words: <span id="word-count">0</span></p>
    </div>

    <script>
        const textInput = document.getElementById("text-input");
        const charCount = document.getElementById("char-count");
        const wordCount = document.getElementById("word-count");

        textInput.addEventListener("input", function() {
            const text = textInput.value;

            const char = text.replace(/\s/g, "").length;
            charCount.textContent = char;

            const word = text.trim().split(/\s+/).filter(word => word !== "");
            wordCount.textContent = word.length;
        });
    </script>
</body>
</html>
