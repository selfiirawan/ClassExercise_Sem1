<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Event Handler</title>
</head>
<body>
    <h1 id="myHeading" style="text-align: center;">Load Event Handler</h1>
    <h2 style="text-align: center;">with addEventListener</h2>

    <script>
        window.addEventListener("load", function() {
            let heading = document.getElementById("myHeading");

            heading.style.color = "green";
        })
    </script>
</body>
</html>
